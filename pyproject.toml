[project]
name = "image-to-ico-converter"
version = "1.0.0"
description = "Convert images to ICO format with GUI - Chuyển đổi ảnh sang định dạng .ico"
authors = [
    { name = "HoangThinh2024" }
]
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
keywords = ["ico", "icon", "converter", "image", "gui", "msi-builder"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "Pillow>=10.0.0",
    "cx-Freeze>=6.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
image-to-ico = "gui_app:main"
ico-converter = "convert_to_ico:main"
msi-builder = "build_msi_gui:main"

[project.urls]
Homepage = "https://github.com/HoangThinh2024/App-Change-Image-to-.ico-file"
Repository = "https://github.com/HoangThinh2024/App-Change-Image-to-.ico-file"
Issues = "https://github.com/HoangThinh2024/App-Change-Image-to-.ico-file/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["."]
include-package-data = true

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py37"
